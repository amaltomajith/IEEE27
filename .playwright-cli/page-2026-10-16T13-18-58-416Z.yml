      - heading "Asking what AI does to us" [level=1] [ref=e37]
      - generic [ref=e40]: We have asked what AI can do. It is time to ask what AI does to us, and what we, in turn, must do differently.
    - generic [ref=e41]:
      - heading "Conference vision" [level=2] [ref=e43]
      - generic [ref=e44]:
        - paragraph [ref=e45]: The world today is rapidly making space for Artificial intelligence across different sectors. Yet the most pertinent questions about AI are not purely computational but human based. How do individuals, organisations, communities adapt to the intelligent systems? What psychological, ethical, structural, and institutional challenges arise when machines begin to reason, recommend, and act alongside us?
        - paragraph [ref=e46]: This conference envisions a structured, multi-disciplinary inquiry into the human dimensions of AI across nine academic departments spanning from engineering and design to psychology, business, and the humanities. Rather than treating AI as a domain owned by any single discipline, this event is designed so that every participating department anchors a distinct track, curates its own scholarly community, and contributes original research to a shared intellectual discussion.
    - generic [ref=e48]:
      - heading "Why it is built this way" [level=2] [ref=e50]
      - generic [ref=e51]:
        - generic [ref=e53]:
          - heading "Interdisciplinary legitimacy" [level=3] [ref=e55]
          - paragraph [ref=e56]: AI's societal impact cannot be understood through a single lens; this conference models the collaborative approach that would give a well-rounded understanding.
        - generic [ref=e58]:
          - heading "Departmental ownership" [level=3] [ref=e60]
          - paragraph [ref=e61]: "Each department manages its track end-to-end: call for papers, peer review, keynote curation, and publication, building institutional research capacity."
        - generic [ref=e63]:
          - heading "Publication output" [level=3] [ref=e65]
          - paragraph [ref=e66]: Tracks are designed to produce independently publishable special issues, edited volumes, or indexed proceedings/ISBN, giving every department a concrete research deliverable.
        - generic [ref=e68]:
          - heading "Community building" [level=3] [ref=e70]
          - paragraph [ref=e71]: Structured networking, cross-track panels, and shared plenaries generate durable inter-departmental research collaborations.
